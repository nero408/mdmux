[package]
name = "mdmux"
version = "0.3.0"
edition = "2024"
description = "A terminal UI for browsing markdown files and rendering them in a cmux split"
authors = ["nero408 <12416716+nero408@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/nero408/mdmux"
homepage = "https://github.com/nero408/mdmux"
readme = "README.md"
keywords = ["tui", "markdown", "cmux", "terminal", "viewer"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "mdmux"
path = "src/lib.rs"

[[bin]]
name = "mdmux"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "5.0"
# Renders markdown into ratatui `Text` for the in-process preview pane
# (the fallback when cmux isn't running). Picked over `tui-markdown`
# because it ships table rendering (header rows, column alignment,
# borders), syntect-backed code highlighting, and TOC/scroll plumbing
# while staying on the ratatui 0.29 line we use. Pinned to =0.2.16 to
# match `tui-markdown`'s previous pinning discipline — the crate is
# still pre-1.0 and breaks within minor versions are explicitly
# allowed.
#
# Only the `markdown-preview` feature is enabled. That keeps us off the
# wider ratkit surface (toasts, dialogs, file-system tree, AI chat,
# etc.) but does pull syntect + pulldown-cmark + arboard transitively;
# the latter brings X11/Wayland clipboard deps on Linux and is the
# dominant size cost of the swap.
ratkit = { version = "=0.2.16", default-features = false, features = ["markdown-preview"] }
# Cross-platform filesystem watcher. Powers live-reload in the in-process
# preview pane — when the open file changes on disk, we re-read and
# re-render. Pinned to the 8.x stable line; 9.x is a release candidate.
notify = "8"

[features]
default = []
test-support = []

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
