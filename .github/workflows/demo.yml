name: demo gif

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/demo.tape"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

# Only one regen at a time; cancel anything older still in flight.
concurrency:
  group: demo-gif
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: render demo.gif
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need a real ref so the commit-back step can push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build mdmux (release)
        run: cargo build --release

      - name: Install mdmux on PATH
        # /usr/local/bin is universally on PATH (incl. inside the ttyd shell
        # that vhs spawns); avoids relying on ~/.profile or $GITHUB_PATH.
        run: |
          sudo install -m 0755 target/release/mdmux /usr/local/bin/mdmux

      - name: Sanity-check binary
        run: |
          mdmux --version
          # `--list` exits cleanly without needing cmux; good smoke test.
          mkdir -p /tmp/sanity && echo "# hi" > /tmp/sanity/a.md
          mdmux --list /tmp/sanity

      # We install vhs + ttyd by hand. `charmbracelet/vhs-action@v2` pins
      # ffmpeg to BtbN's n5.1 release pattern, which no longer exists
      # (BtbN ships ffmpeg-master-latest-* now), so the action fails with
      # "Failed to install ffmpeg". ffmpeg is already on ubuntu-latest, so
      # we just need vhs (.deb) and ttyd (static binary).
      - name: Install ttyd
        run: |
          set -euxo pipefail
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          ttyd --version

      - name: Install vhs
        env:
          VHS_VERSION: "0.11.0"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/vhs.deb \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/vhs.deb
          vhs --version
          ffmpeg -version | head -1

      - name: Render demo.gif
        run: |
          vhs assets/demo.tape
          ls -la assets/demo.gif
          # Bail loudly if the gif came out empty / suspiciously small.
          size=$(stat -c%s assets/demo.gif)
          echo "demo.gif is ${size} bytes"
          if [ "$size" -lt 20000 ]; then
            echo "::error::demo.gif is suspiciously small (<20kB) — vhs likely failed silently"
            exit 1
          fi

      - name: Upload artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: assets/demo.gif
          if-no-files-found: error

      - name: Commit regenerated gif
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # `[skip ci]` prevents the commit-back from re-triggering CI, and
          # the `paths:` filter above already excludes assets/demo.gif anyway
          # — belt + suspenders.
          commit_message: "chore(demo): regenerate demo.gif [skip ci]"
          file_pattern: assets/demo.gif
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
