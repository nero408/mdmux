name: release

on:
  push:
    tags: ["v*"]
  # Allow re-running manually for a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            # 22.04 has a glibc old enough to run on most Linux desktops in
            # the wild. Bump only when 22.04 reaches EOL.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksum
        id: pkg
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="mdmux-${TAG}-${{ matrix.target }}"
          STAGE=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/mdmux" "$STAGE/mdmux"
          cp LICENSE README.md "$STAGE/"
          tar -C "$STAGE" -czf "${NAME}.tar.gz" mdmux LICENSE README.md
          # macOS shasum vs Linux sha256sum — both available on their hosts.
          if command -v sha256sum >/dev/null; then
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: github release + tap bump
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for LICENSE/notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          set -euxo pipefail
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec mv {} release/ \;
          ls -la release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Bump Homebrew tap formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping tap bump."
            echo "::warning::Create a fine-grained PAT with Contents: read+write on nero408/homebrew-tap and add it as the HOMEBREW_TAP_TOKEN secret on nero408/mdmux."
            exit 0
          fi

          VERSION="${TAG#v}"
          read_sha() {
            awk '{print $1}' "release/$1.sha256"
          }
          SHA_ARM_DARWIN=$(read_sha "mdmux-${TAG}-aarch64-apple-darwin.tar.gz")
          SHA_X86_DARWIN=$(read_sha "mdmux-${TAG}-x86_64-apple-darwin.tar.gz")
          SHA_X86_LINUX=$(read_sha "mdmux-${TAG}-x86_64-unknown-linux-gnu.tar.gz")

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nero408/homebrew-tap" \
            tap
          mkdir -p tap/Formula
          cat > tap/Formula/mdmux.rb <<EOF
          class Mdmux < Formula
            desc "Terminal UI for browsing markdown files in a cmux side-panel"
            homepage "https://github.com/nero408/mdmux"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/nero408/mdmux/releases/download/${TAG}/mdmux-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM_DARWIN}"
              end
              on_intel do
                url "https://github.com/nero408/mdmux/releases/download/${TAG}/mdmux-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_DARWIN}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/nero408/mdmux/releases/download/${TAG}/mdmux-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_LINUX}"
              end
            end

            def install
              bin.install "mdmux"
            end

            test do
              assert_match "mdmux", shell_output("#{bin}/mdmux --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mdmux.rb
          if git diff --cached --quiet; then
            echo "formula unchanged, nothing to push"
            exit 0
          fi
          git commit -m "mdmux ${TAG}"
          git push
