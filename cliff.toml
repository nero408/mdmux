# git-cliff configuration.
#
# Generates CHANGELOG.md from conventional-commit messages between tags.
# Invoked by cargo-release (see `pre-release-hook` in release.toml).
#
# Conventional commit groups we recognize:
#   feat:     ... → Features
#   fix:      ... → Bug Fixes
#   perf:     ... → Performance
#   refactor: ... → Refactor
#   docs:     ... → Documentation
#   test:     ... → Tests
#   chore:    ... → Chores
#   ci:       ... → CI
#   build:    ... → Build
#   security: ... → Security
#
# Commits that don't follow this format are still kept (under "Other") so
# nothing gets silently dropped.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Entries are generated from [conventional commits](https://www.conventionalcommits.org)
by [git-cliff](https://git-cliff.org).

"""
# Per-release section. Tera template syntax.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ self::commit_url(commit=version) }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::commit_url(commit=commit.id) }})){% endif %}\
    {% endfor %}
{% endfor %}\n
{%- macro commit_url(commit) -%}
    https://github.com/nero408/mdmux/commit/{{ commit }}
{%- endmacro -%}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Use conventional-commit parser to classify each commit.
conventional_commits = true
# Don't fail loudly on commits that aren't conventional — keep them under
# "Other" instead so contributors writing free-form messages aren't
# blocked from shipping.
filter_unconventional = false
# Default lookalike-merge detection.
split_commits = false

# Group commits by type. Order matters — earlier entries appear higher in
# each release section.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(demo\\)", skip = true },
  { message = "^chore", group = "Chores" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other" },
]
filter_commits = false
# Match the tag prefix used by cargo-release.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
# Don't include the `[skip ci]` demo-regen commits in the changelog — they
# bury the signal.
skip_tags = ""
# Newest release first.
topo_order = false
sort_commits = "newest"
